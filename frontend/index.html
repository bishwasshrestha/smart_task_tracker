<!DOCTYPE html>
<html lang="en">

<head>

  <title>Task Tracker</title>
  <link rel="stylesheet" href="style.css">

<body>
  <h1>Smart Task Tracker</h1>

  </div>
</body>
<script src="script.js"></script>

</html>
